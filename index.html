<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Official rules for the Beyond The Horizon Discord server." />
  <title>BTH - Discord Rules</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="itsmias-sig.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="content-wrapper">
    <article id="rules-content" class="rules-panel">
      <p class="loading-msg">Loading rules&hellip;</p>
    </article>
    <p id="last-updated" class="last-updated"></p>
  </main>

  <footer class="site-footer">
    <a class="mias-sig" href="https://itsmias.com/" target="_blank" rel="noopener" aria-label="Made by ItsMias, itsmias.com">
      <span class="mias-sig-label">Made by</span>
      <span class="mias-sig-mark">ITSMIAS</span>
      <span class="mias-sig-url">itsmias.com<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></span>
    </a>
  </footer>

  <script src="itsmias-sig.js" defer></script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('./rules.md')
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(md) {
        document.getElementById('rules-content').innerHTML = marked.parse(md);
      })
      .catch(function() {});

    fetch('https://api.github.com/repos/BeyondTheHorizonProductions/Rules/commits?per_page=1')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var date = new Date(data[0].commit.committer.date);
        var formatted = date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('last-updated').textContent = 'Last updated ' + formatted;
      })
      .catch(function() {});
  </script>

</body>
</html>
